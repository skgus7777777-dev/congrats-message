<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 엄마, 생신 축하드려요! 💕</title>
    <style>
        /* 기본 스타일 및 핑크빛 그라데이션 배경 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 100%);
            margin: 0;
            padding: 20px;
            color: #4a4a4a;
            min-height: 100vh;
        }

        /* 중앙 정렬 컨테이너 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
            backdrop-filter: blur(10px);
        }

        /* 반짝이는 메인 타이틀 효과 */
        h1 {
            text-align: center;
            color: #ff4d6d;
            font-size: 2.5em;
            text-shadow: 0 0 10px #fff, 0 0 20px #ffb3c1, 0 0 30px #ff4d6d;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.9; text-shadow: 0 0 10px #fff, 0 0 20px #ffb3c1; }
            100% { opacity: 1; text-shadow: 0 0 15px #fff, 0 0 30px #ff4d6d, 0 0 40px #ff0054; }
        }

        /* 메시지 입력 폼 스타일 */
        .input-form {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border: 2px solid #ffccd5;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ff758f;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ffe5ec;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            background-color: #fffafb;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #ff758f;
            box-shadow: 0 0 8px rgba(255, 117, 143, 0.3);
        }

        /* 등록 버튼 */
        .submit-btn {
            background: linear-gradient(45deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6);
        }

        /* 축하 카드 그리드 레이아웃 */
        .rolling-paper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 메시지 카드 개별 스타일 */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #ffe5ec;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #ff758f;
        }

        /* 카드 내부 이미지 */
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #ffeef2;
        }

        /* 카드 내부 텍스트 */
        .card-content {
            padding: 20px;
        }

        .card-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff4d6d;
            margin-bottom: 10px;
            border-bottom: 1px dashed #ffe5ec;
            padding-bottom: 5px;
        }

        .card-message {
            font-size: 0.95em;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 엄마의 생신을 축하합니다 ✨</h1>
    
    <!-- 메시지 작성 양식 -->
    <div class="input-form">
        <div class="input-group">
            <label for="username">💝 남기는 사람 이름</label>
            <input type="text" id="username" placeholder="예: 첫째 딸, 사위">
        </div>
        <div class="input-group">
            <label for="photoUrl">📸 사진 이미지 링크 (URL)</label>
            <input type="text" id="photoUrl" placeholder="https://... 형식의 인터넷 이미지 주소를 넣어주세요">
        </div>
        <div class="input-group">
            <label for="message">💌 축하 메시지</label>
            <textarea id="message" rows="4" placeholder="엄마에게 전하고 싶은 진심 어린 한마디를 적어주세요."></textarea>
        </div>
        <button class="submit-btn" onclick="addCard()">✨ 축하 카드 등록하기 ✨</button>
    </div>

    <!-- 카드가 누적되는 영역 -->
    <div class="rolling-paper" id="rollingPaper">
        <!-- 기본 예시 카드 -->
        <div class="card">
            <img src="https://unsplash.com" alt="추천 기본 이미지">
            <div class="card-content">
                <div class="card-name">가족 일동 💕</div>
                <div class="card-message">엄마 생신을 진심으로 축하드려요!\n언제나 우리 곁에서 든든한 버팀목이 되어주셔서 감사해요. 세상에서 가장 행복한 하루 보내세요! 사랑합니다.</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 카드를 추가하는 함수
    function addCard() {
        const nameInput = document.getElementById('username');
        const photoInput = document.getElementById('photoUrl');
        const messageInput = document.getElementById('message');
        const paper = document.getElementById('rollingPaper');

        // 유효성 검사 (이름과 메시지는 필수)
        if (!nameInput.value.trim() || !messageInput.value.trim()) {
            alert('이름과 축하 메시지를 입력해주세요! 💕');
            return;
        }

        // 기본 이미지 설정 (사진 주소가 없을 때 보일 핑크 하트 이미지)
        const defaultImg = "https://unsplash.com";
        const imgSrc = photoInput.value.trim() ? photoInput.value.trim() : defaultImg;

        // 새 카드 HTML 구조 생성
        const card = document.createElement('div');
        card.className = 'card';
        
        card.innerHTML = `
            <img src="${imgSrc}" onerror="this.src='${defaultImg}'" alt="축하 사진">
            <div class="card-content">
                <div class="card-name">${escapeHtml(nameInput.value)}</div>
                <div class="card-message">${escapeHtml(messageInput.value)}</div>
            </div>
        `;

        // 최신 카드가 앞에 오도록 추가
        paper.insertBefore(card, paper.firstChild);

        // 입력창 초기화
        nameInput.value = '';
        photoInput.value = '';
        messageInput.value = '';
    }

    // 보안을 위한 HTML 특수문자 치환 함수
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
