
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4eee2" />
  <title>엄마의 가장 아름다운 날 | 媽媽生日快樂</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --paper: #f4eee2;
      --paper-light: #fffaf0;
      --ink: #49382c;
      --muted: #887564;
      --brown: #79563e;
      --rose: #a65e57;
      --line: #d9c8af;
      --shadow: 0 8px 24px rgba(83, 59, 39, .12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(255,255,255,.8), transparent 45%),
        radial-gradient(ellipse at 90% 70%, rgba(177,135,91,.09), transparent 40%);
      font-family: "Nanum Myeongjo", serif;
      line-height: 1.8;
    }

    button, input, textarea { font: inherit; }

    button, a { -webkit-tap-highlight-color: transparent; }

    img { max-width: 100%; }

    .page {
      width: min(100% - 28px, 960px);
      margin: 0 auto;
    }

    .top-note {
      padding: 20px 0 12px;
      text-align: center;
      font-family: "DM Serif Display", serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--muted);
    }

    .cover {
      position: relative;
      overflow: hidden;
      margin: 10px 0 45px;
      padding: 55px 24px 45px;
      text-align: center;
      border: 1px solid var(--line);
      outline: 5px solid rgba(255,250,240,.7);
      background: rgba(255,250,240,.72);
      box-shadow: var(--shadow);
    }

    .cover::before, .cover::after {
      content: "✦";
      position: absolute;
      color: #c4a77f;
      font-size: 25px;
    }

    .cover::before { top: 16px; left: 20px; }
    .cover::after { bottom: 16px; right: 20px; }

    .eyebrow {
      font-family: "DM Serif Display", serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--rose);
    }

    h1 {
      margin: 15px 0;
      font-size: clamp(31px, 7vw, 54px);
      line-height: 1.4;
      font-weight: 800;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      font-size: .48em;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--brown);
    }

    .cover-description {
      margin: 20px auto;
      max-width: 560px;
      font-size: 14px;
      color: var(--muted);
    }

    .cover-stamp {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--rose);
      font-size: 12px;
      letter-spacing: 2px;
      transform: rotate(-3deg);
    }

    .cover-photo {
      width: min(100%, 430px);
      margin: 30px auto 0;
      padding: 12px 12px 34px;
      background: #fffdf7;
      box-shadow: 0 6px 20px rgba(64, 42, 26, .18);
      transform: rotate(-1.2deg);
    }

    .cover-photo img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e7dac7;
    }

    .photo-caption {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .section {
      margin: 55px 0;
      scroll-margin-top: 20px;
    }

    .section-heading {
      margin-bottom: 25px;
      text-align: center;
    }

    .section-heading .en {
      display: block;
      color: var(--rose);
      font-family: "DM Serif Display", serif;
      font-size: 12px;
      letter-spacing: 4px;
    }

    h2 {
      margin: 4px 0;
      font-size: clamp(24px, 5vw, 32px);
    }

    .section-subtitle {
      margin: 5px 0 0;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    .album-intro {
      max-width: 600px;
      margin: 0 auto 28px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px 17px;
    }

    .photo-card {
      min-width: 0;
      padding: 10px 10px 15px;
      background: #fffdf7;
      box-shadow: var(--shadow);
      border: 1px solid #e8ddcc;
      transition: transform .25s ease;
    }

    .photo-card:nth-child(3n + 1) { transform: rotate(-1.5deg); }
    .photo-card:nth-child(3n + 2) { transform: rotate(1.3deg); }
    .photo-card:nth-child(3n) { transform: rotate(-.5deg); }

    .photo-card:hover { transform: translateY(-4px) rotate(0); }

    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #e9dece;
      cursor: zoom-in;
    }

    .photo-card .caption {
      padding: 10px 3px 0;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .photo-card .caption small {
      display: block;
      margin-top: 3px;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    .memory-divider {
      margin: 48px auto;
      max-width: 250px;
      text-align: center;
      color: #b69a75;
      letter-spacing: 12px;
    }

    .letter-box {
      padding: 26px 20px;
      border: 1px solid var(--line);
      background: rgba(255,250,240,.75);
      box-shadow: var(--shadow);
    }

    .letter-box > p {
      margin-top: 0;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field { margin-bottom: 17px; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field label span {
      display: block;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 12px;
      background: #fffdf8;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--brown);
      box-shadow: 0 0 0 2px rgba(121,86,62,.1);
    }

    textarea {
      min-height: 145px;
      resize: vertical;
    }

    .upload-area {
      padding: 14px;
      border: 1px dashed #c9b69c;
      background: rgba(255,255,255,.45);
    }

    input[type="file"] {
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .help {
      margin: 7px 0 0;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    #preview {
      display: none;
      width: min(100%, 230px);
      max-height: 260px;
      margin-top: 12px;
      object-fit: cover;
      border: 7px solid white;
      box-shadow: var(--shadow);
    }

    .submit-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border: 1px solid #704c3c;
      background: #704c3c;
      color: #fffaf0;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background .2s;
    }

    .submit-button:hover { background: #583d31; }
    .submit-button:disabled { opacity: .6; cursor: wait; }

    .form-message {
      min-height: 28px;
      margin: 10px 0 0;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .message-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .message-card {
      position: relative;
      min-width: 0;
      padding: 23px 18px 18px;
      border: 1px solid #e2d2bd;
      background:
        linear-gradient(rgba(255,250,240,.93), rgba(255,250,240,.93)),
        repeating-linear-gradient(transparent 0 31px, #d8c6ae 32px);
      box-shadow: 0 4px 12px rgba(83,59,39,.08);
      overflow-wrap: anywhere;
    }

    .message-card::before {
      content: "❝";
      position: absolute;
      top: -9px;
      right: 12px;
      color: #c6aa87;
      font-size: 36px;
    }

    .message-name {
      margin: 0 0 10px;
      color: var(--rose);
      font-size: 17px;
      font-weight: 800;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .message-photo {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 15px;
      background: #eee2d1;
      cursor: zoom-in;
    }

    .message-date {
      margin-top: 14px;
      padding-top: 9px;
      border-top: 1px solid #e5d8c6;
      font-family: "DM Serif Display", serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 28px 15px;
      text-align: center;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .closing {
      margin: 65px 0 20px;
      padding: 35px 18px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .closing .heart {
      font-size: 25px;
      color: var(--rose);
    }

    .closing p { margin: 5px 0; }

    .closing .chinese {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

      padding: 15px 0 30px;
      text-align: center;
      color: var(--muted);
      font-fami
